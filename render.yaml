services:
  - type: web
    name: rutasegura-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: DATABASE_URL
        fromDatabase:
          name: rutasegura-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"

databases:
  - name: rutasegura-db
    plan: free
    databaseName: rutasegura
    user: rutasegura



    
